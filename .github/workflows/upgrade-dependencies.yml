name: Upgrade C# dependencies

on:
  push:
    branches:
      - main

  schedule:
    - cron: '5 2 * * 1' # every Monday

  workflow_dispatch:

jobs:
  upgrade:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Use PAT instead of GITHUB_TOKEN to allow this workflow to trigger other workflows
      # PAT should have permissions: contents:write, pull-requests:write
      # Scoped to this repository only
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.x

      - name: Build
        run: dotnet build $GITHUB_WORKSPACE/AzDoExtensionNews/AzDoExtensionNews.sln

      - name: Upgrade packages
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # get the tool
          dotnet tool install --global dotnet-outdated-tool

          # run the tool, skip the restore to prevent issues with the lock file
          dotnet outdated --no-restore --upgrade AzDoExtensionNews\

          # now try a restore, if it succeeds, we can still continue
          dotnet restore AzDoExtensionNews/AzDoExtensionNews.sln --use-lock-file --force-evaluate

          # check for any updates with git porcelain
          if [[ -n $(git status --porcelain "Directory.Packages.props") ]]; then

            # build the solution again to make sure it did not break
            dotnet build $GITHUB_WORKSPACE/AzDoExtensionNews/AzDoExtensionNews.sln

            echo "Committing changes to git and pushing to GitHub..."
            git checkout -b upgrade-dependencies

            git config --global user.email "bot@github-actions.com"
            git config --global user.name "GitHub Actions Bot"

            git add "Directory.Packages.props"

            git commit -am "chore: upgrade c# dependencies"

            # Push with a rebase-and-retry loop: concurrent runs of this workflow can race to
            # push the same 'upgrade-dependencies' branch, which git rejects with a
            # "fetch first" / "[rejected]" error. When we detect that specific error, fetch the
            # remote branch, rebase our commit on top of it, and try the push again.
            max_attempts=3
            attempt=1
            while true; do
              push_output=$(git push --set-upstream origin upgrade-dependencies 2>&1) && push_status=0 || push_status=$?
              echo "$push_output"

              if [ "$push_status" -eq 0 ]; then
                break
              fi

              if echo "$push_output" | grep -q "\[rejected\]" && echo "$push_output" | grep -qi "fetch first"; then
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "::error::Push rejected due to concurrent changes after $max_attempts attempts, giving up."
                  exit 1
                fi

                echo "Push rejected because of concurrent changes to 'upgrade-dependencies' (attempt $attempt/$max_attempts). Rebasing on top of the remote branch and retrying..."
                git fetch origin upgrade-dependencies
                if ! git rebase origin/upgrade-dependencies; then
                  echo "::error::Rebase onto origin/upgrade-dependencies failed with conflicts, giving up."
                  git rebase --abort
                  exit 1
                fi

                attempt=$((attempt + 1))
              else
                echo "::error::git push failed for a reason other than concurrent updates."
                exit 1
              fi
            done

            gh pr create --title "chore: upgrade dependencies" --body "This PR upgrades C# dependencies"
          else
            echo "No changes detected"
          fi