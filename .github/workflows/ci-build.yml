name: CI Build

on:
  push:
    paths:
    - Directory.Packages.props
    - AzDoExtensionNews/**
    - .github/workflows/ci-build.yml

  # required workflow for the PR builds as well
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-build:
    runs-on: ubuntu-latest
    # Run inside Microsoft's official Playwright .NET image, which already ships the exact
    # OS-level dependencies + browsers Playwright needs (matching Directory.Packages.props'
    # Microsoft.Playwright version) and a .NET 8 SDK. This avoids ever needing `sudo apt-get`
    # to install browser dependencies, so Harden Runner's disable-sudo can stay fully in
    # effect for the whole job instead of being loosened just to work around a flaky
    # `playwright install --with-deps` on the bare ubuntu-latest image.
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.61.0-noble
    steps:
    # setup the environment:
    - name: Harden Runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        disable-sudo: true
        egress-policy: block
        allowed-endpoints: >
          api.nuget.org:443
          dc.services.visualstudio.com:443
          github.com:443
          dotnetcli.azureedge.net:443
          aka.ms:443
          builds.dotnet.microsoft.com:443
          ci.dot.net:443
          playwright.azureedge.net:443
          ms-playwright.azureedge.net:443
          github.githubassets.com:443
          mcr.microsoft.com:443
          *.data.mcr.microsoft.com:443
          *.cdn.mscr.io:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3.5.3
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ hashFiles('**/**.csproj') }}-1

    # build it:
    - name: Restore
      run: |
        # Try locked mode first for security
        if ! dotnet restore AzDoExtensionNews/AzDoExtensionNews.sln --locked-mode; then
          # If locked mode fails and this is a Dependabot PR, try updating lock files
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "Locked mode failed on Dependabot PR, updating lock files"
            dotnet restore AzDoExtensionNews/AzDoExtensionNews.sln --use-lock-file --force-evaluate
          else
            echo "Locked mode failed on non-Dependabot PR, failing build"
            exit 1
          fi
        fi

    - name: Build
      run: dotnet build AzDoExtensionNews/AzDoExtensionNews.sln -c Release

    - name: Test
      run: dotnet test AzDoExtensionNews/AzDoExtensionNews.sln -c Release --no-build --filter "TestCategory!=MarketplaceScraping"

    # publish the AzDo news:
    - name: Publish AzDo News
      run: dotnet publish AzDoExtensionNews/AzDoExtensionNews/AzDoExtensionNews.csproj -c Release -o publish/AzDo/

    - name: Publish AzDo Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: publish/AzDo
        name: AzDoNews

    # also publish GitHub news:
    - name: Publish GitHub News
      run: dotnet publish AzDoExtensionNews/GitHubActionsNews/GitHubActionsNews.csproj -c Release -o publish/GitHub/

    - name: Publish GitHub Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: publish/GitHub
        name: GitHubNews
